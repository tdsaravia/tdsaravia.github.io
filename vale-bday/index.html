  <style>
    :root {--pink:#FFE8F2;--paper:#FFF9FB;--red:#BC333C;--berry:#9D3348;--ink:#492735;}

    html{scroll-behavior:smooth;}
    body{margin:0;background:#f2d8e3;color:var(--ink);font-family:'DM Sans',sans-serif;}
    .site{width:min(100%,440px);margin:0 auto;overflow:hidden;background:var(--pink);box-shadow:0 3px 45px #4e172425;}
    .panel{height:790px;position:relative;text-align:center;padding:0 46px;isolation:isolate;}
    .panel--second{height:750px;margin-top:-2px;}
    .wavy{position:absolute;inset:12px 12px;z-index:-1;width:calc(100% - 24px);height:calc(100% - 24px);pointer-events:none;}
    .wavy path{fill:none;stroke:var(--red);stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
    .star{position:absolute;color:var(--berry);width:21px;height:21px;}
    .star svg{width:100%;height:100%}
    .star.one{top:181px;left:59px;transform:rotate(14deg)}
    .star.two{top:222px;right:64px;transform:rotate(-14deg) scale(.75)}
    .star.three{right:70px;top:510px;transform:rotate(26deg) scale(.7)}
    .bow{position:absolute;top:39px;right:54px;width:51px;height:45px;transform:rotate(15deg)}
    .bow svg{width:100%;height:100%;fill:none;stroke:var(--berry);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
    .content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;}
    .first-content{padding-top:151px;}
    .kiss{font-family:'DM Serif Display',Georgia,serif;font-size:31px;letter-spacing:1.1px;color:var(--berry);font-weight:400;margin:0}
    .its{font-family:'DM Serif Display',Georgia,serif;font-size:26px;color:var(--berry);font-style:italic;margin-top:17px;position:relative;z-index:0;}
    .its::before{content:'';position:absolute;z-index:-1;width:91px;height:61px;filter:blur(12px);background:#F6ACBB88;left:50%;top:-9px;transform:translateX(-50%);border-radius:50%}
    .birthday{font-family:'Oswald',Impact,sans-serif;color:var(--berry);font-size:clamp(56px,14vw,67px);transform:scaleX(.84);font-weight:700;letter-spacing:1px;line-height:1.1;margin:23px -22px 0;text-shadow:3px 4px 0 #EDACBD;white-space:nowrap}
    .name{font-family:'Caveat','Comic Neue','Comic Sans MS',cursive;font-size:34px;color:var(--berry);line-height:1;margin:10px 0 0;transform:rotate(-4deg)}
    .heart-doodle{width:74px;height:66px;margin:33px 0 0;color:var(--red);}
    .heart-doodle svg{width:100%;height:100%;overflow:visible}
    .save{font-family:'Caveat',cursive;font-family:'Caveat','Comic Neue','Comic Sans MS',cursive;font-size:40px;font-weight:700;color:var(--berry);line-height:1;white-space:nowrap;transform:rotate(-7deg) scaleX(.9);margin:43px -12px 13px;}
    .date-title{font-family:'Caveat','Comic Neue','Comic Sans MS',cursive;font-weight:600;font-size:25px;white-space:nowrap;color:var(--berry);margin:5px 0 0;border-bottom:1.8px solid var(--berry);padding:0 6px 5px;}
    .tiny-bottom{position:absolute;bottom:60px;left:0;right:0;font-size:18px;letter-spacing:3px;color:var(--red)}
    .second-content{padding-top:118px;}
    .detail-label{font-family:'DM Sans',sans-serif;letter-spacing:3.1px;text-transform:uppercase;color:var(--berry);font-weight:700;font-size:13px;}
    .day-number{font-family:'DM Serif Display',Georgia,serif;font-size:141px;line-height:1;color:var(--berry);letter-spacing:-12px;margin:20px 20px -5px 0;position:relative}
    .day-number::after{content:'✧';position:absolute;right:-23px;top:11px;color:var(--red);font-size:32px;letter-spacing:normal;transform:rotate(24deg)}
    .month{font-family:'Oswald',Impact,sans-serif;color:var(--berry);font-size:27px;letter-spacing:3px;line-height:1.25;margin:3px 0 28px;text-transform:uppercase}
    .event-time{font-family:'DM Serif Display',Georgia,serif;font-size:33px;color:var(--red);line-height:1.2;margin:-17px 0 22px;}
    .thin-rule{height:1px;width:142px;background:#C98394;margin:0 auto 44px;}
    .label{font-family:'Caveat','Comic Neue','Comic Sans MS',cursive;font-size:30px;margin-bottom:12px;transform:rotate(-3deg);color:var(--berry);}
    .place{font-family:'DM Serif Display',Georgia,serif;font-size:32px;line-height:1.1;color:var(--ink);margin:0;}
    .underlined{width:155px;height:1px;background:var(--berry);margin:19px auto 0;}
    .end{font-family:'DM Serif Display',Georgia,serif;font-style:italic;font-size:43px;color:var(--red);margin-top:59px;line-height:1.15;}
    .little-heart{display:block;margin-top:10px;color:var(--red);font-size:31px;line-height:1;}
    .disclaimer{font-size:12px;letter-spacing:1.8px;position:absolute;bottom:65px;left:0;right:0;color:var(--berry)}
    .second-sparkle{position:absolute;left:70px;top:165px;color:var(--berry);font-size:20px;transform:rotate(-14deg)}
    .second-sparkle.b{left:auto;right:70px;top:404px;transform:rotate(10deg)}
    @media(min-width:600px){body{padding:24px 0}}
    @media(max-width:380px){.panel{padding:0 40px}.birthday{font-size:54px}.first-content{padding-top:156px}.save{font-size:37px}.date-title{font-size:23px}.place{font-size:29px}.bow{right:47px}.second-content{padding-top:126px}}
    @media(prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
  </style>
